<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>개편안 D — 발표</title>
<style>
/* ============================================================
   개편안 D — 발표
   레퍼런스: Modern Product Launch

   그 장르의 논리는 하나다. **오늘 내놓는 것 하나를 무대에 세운다.**
   어두운 무대, 물건에 떨어지는 빛, 굵은 표제, 그리고 눌러야 할 곳
   딱 한 군데만 색을 쓴다.

   이 앱에 옮기면 무대에 서는 물건은 오늘의 단어다. 매일 하나씩
   발표된다는 감각이 학습 앱의 "오늘 뭐 하지" 와 정확히 맞는다.

   색을 하나 들이되 **한 화면에 한 군데만** 쓴다. 초록·호박·강청은
   학습 상태가, 빨강은 오답이 이미 가져갔으므로 남은 자리에서 골랐다.
   그림 안쪽 토큰은 건드리지 않는다. 그림의 파랑은 뜻을 지고 있다.
   ============================================================ */

@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-display:swap;
  src:url("../fonts/pretendard-subset.woff2") format("woff2-variations")}

:root{
  --stage:#0a0a0c;        /* 무대 바닥 */
  --lit:#17171b;          /* 빛이 닿은 면 */
  --lit-2:#202026;
  --line:#26262d;
  --line-2:#3a3a44;

  --ink:#f4f4f6;
  --ink-2:#a9a9b4;
  --ink-3:#75757f;

  --go:#ff4d78;           /* 한 화면에 한 군데. 오늘 눌러야 할 곳 */
  --go-ink:#12040a;

  --st-new:#75757f;
  --st-reading:#8cbdd6;   /* 그림이 쓰는 값. 브랜드색으로 덮지 않는다 */
  --st-reading-bg:#16242b;
  --st-learned:#86c2a0;
  --st-passed:#9ad3b2;
  --st-review:#e0ac5e;

  --font-sans:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;

  /* 그림이 요구하는 이름. 이 앱의 이름 규약에 맞춰 무대 색을 이어 준다. */
  --surface:var(--lit);
  --surface-sunken:var(--lit-2);
  --line-strong:var(--line-2);
  --r:18px; --r-sm:12px; --r-full:999px;
}

*{box-sizing:border-box}
body{margin:0;background:#2a2a30;font-family:var(--font-sans);
     display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start}
.frame{width:390px;flex:0 0 390px}
.frame>h2{color:#fff;font-size:12px;font-weight:700;margin:0 0 6px 2px}
.phone{width:390px;height:844px;overflow:hidden;border-radius:14px;
       background:var(--stage);color:var(--ink);display:flex;flex-direction:column}

.bar{height:52px;flex:0 0 52px;display:flex;align-items:center;padding:0 18px;gap:10px}
.bar b{font-size:15px;font-weight:700}
.bar .r{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.body{flex:1;overflow:hidden;padding:0 18px}
.tabs{flex:0 0 62px;display:grid;grid-template-columns:repeat(4,1fr);
      background:var(--lit);border-top:1px solid var(--line)}
.tabs div{display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:4px;font-size:10.5px;color:var(--ink-3)}
.tabs div.on{color:var(--ink)}
.tabs i{width:18px;height:18px;border:1.6px solid currentColor;border-radius:5px;display:block}
.tabs div.on i{background:currentColor}

/* ---- 무대 ----
   오늘의 단어를 얹는 면. 위에서 빛이 떨어지는 것처럼 위쪽만 밝다.
   그림자는 안 쓴다. 밝기 차이만으로 물건을 띄운다. */
.stage{margin-top:8px;border-radius:var(--r);overflow:hidden;
       background:linear-gradient(180deg,var(--lit-2) 0%,var(--lit) 46%,var(--lit) 100%);
       border:1px solid var(--line);padding:20px 18px 18px}
.tag{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;
     border-radius:var(--r-full);background:rgba(255,255,255,.07);
     font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.word{font-size:42px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:14px 0 0}
.rom{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);margin-top:9px}
.stage .plate{margin-top:18px}
.stage .plate svg{width:100%;height:auto;display:block}
.blurb{font-size:14.5px;line-height:1.65;color:var(--ink-2);margin-top:16px}
.blurb b{color:var(--ink);font-weight:700}

/* ---- 딱 하나의 액션 ---- */
.go{height:54px;margin-top:16px;border-radius:var(--r-full);background:var(--go);
    color:var(--go-ink);display:flex;align-items:center;justify-content:center;gap:9px;
    font-weight:800;font-size:16px;letter-spacing:-.01em}
.go2{height:48px;margin-top:10px;border-radius:var(--r-full);
     border:1px solid var(--line-2);color:var(--ink);display:flex;
     align-items:center;justify-content:center;font-weight:600;font-size:14.5px}

/* ---- 오늘 숫자 ---- */
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.row3 div{background:var(--lit);border:1px solid var(--line);border-radius:var(--r-sm);
          padding:12px 13px}
.row3 .n{font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.row3 .k{font-size:11px;color:var(--ink-3);margin-top:3px}

/* ---- 검색 ---- */
.search{display:flex;align-items:center;gap:9px;height:46px;margin-top:10px;
        padding:0 15px;background:var(--lit);border:1px solid var(--line);
        border-radius:var(--r-full);color:var(--ink-3);font-size:14px}

/* ---- 권 알약 ---- */
.books{display:flex;gap:8px;margin-top:12px;overflow:hidden}
.books div{flex:0 0 auto;height:34px;padding:0 14px;border-radius:var(--r-full);
           background:var(--lit);border:1px solid var(--line);display:flex;
           align-items:center;gap:7px;font-size:13px;white-space:nowrap;color:var(--ink-2)}
.books div.on{background:var(--ink);color:var(--stage);border-color:var(--ink);font-weight:700}
.books em{font-style:normal;font-family:var(--font-mono);font-size:10.5px;opacity:.7}

/* ---- 목록 카드 ----
   발표 장르는 카드를 쓴다. 대신 한 줄짜리 얇은 카드로 눌러 밀도를 지킨다. */
.cards{margin-top:12px;display:grid;gap:7px}
.card{background:var(--lit);border:1px solid var(--line);border-radius:var(--r-sm);
      padding:11px 13px;display:flex;align-items:center;gap:10px;min-width:0}
.card .t{font-size:14.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.card .s{font-size:12px;color:var(--ink-3);overflow:hidden;white-space:nowrap;
         text-overflow:ellipsis;flex:1}
.card .d{flex:0 0 7px;height:7px;border-radius:50%;background:var(--st-new)}
.card .d.r{background:var(--st-reading)}
.card .d.p{background:var(--st-passed)}
.card .d.o{background:transparent;box-shadow:inset 0 0 0 1.3px var(--st-new)}

/* ---- 읽기 ---- */
.lede{font-size:17px;line-height:1.68;margin-top:18px}
.lede u{text-decoration:none;border-bottom:2px dotted var(--st-reading);font-weight:700}
.dock{flex:0 0 82px;display:flex;align-items:center;gap:10px;padding:0 18px;
      background:var(--lit);border-top:1px solid var(--line)}
.dock .s{flex:0 0 46px;height:46px;border-radius:var(--r-full);border:1px solid var(--line-2);
         display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.dock .m{flex:1;height:50px;border-radius:var(--r-full);background:var(--go);
         color:var(--go-ink);display:flex;align-items:center;justify-content:center;
         gap:8px;font-weight:800;font-size:15px}

/* ---- 진도 ----
   발표 장르의 지표 카드. 큰 숫자 하나를 무대에 올리고 나머지는 작게. */
.hero-n{background:linear-gradient(180deg,var(--lit-2),var(--lit));
        border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;margin-top:8px}
.hero-n .n{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:.92;
           font-variant-numeric:tabular-nums}
.hero-n .k{font-size:13px;color:var(--ink-2);margin-top:8px}
.hero-n .track{height:6px;border-radius:var(--r-full);background:rgba(255,255,255,.08);
               margin-top:16px;overflow:hidden}
.hero-n .track i{display:block;height:6px;background:var(--go);border-radius:var(--r-full)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mini div{background:var(--lit);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px}
.mini .n{font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mini .k{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.blist{margin-top:14px}
.brow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.brow .n{flex:0 0 74px;font-size:12.5px;color:var(--ink-2);overflow:hidden;
         white-space:nowrap;text-overflow:ellipsis}
.brow .t{flex:1;height:4px;border-radius:var(--r-full);background:rgba(255,255,255,.07);overflow:hidden}
.brow .t i{display:block;height:4px;background:var(--ink-2);border-radius:var(--r-full)}
.brow .v{flex:0 0 42px;text-align:right;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}
</style>
</head>
<body>
<script src="_mockdata.js"></script>

<section class="frame"><h2>홈 — 오늘 하나를 무대에</h2><div class="phone">
  <div class="bar"><b>8월 24일</b><span class="r">1일 연속</span></div>
  <div class="body" id="home"></div>
  <div class="tabs"><div class="on"><i></i>홈</div><div><i></i>단어장</div><div><i></i>퀴즈</div><div><i></i>진도</div></div>
</div></section>

<section class="frame"><h2>단어장</h2><div class="phone">
  <div class="bar"><b>단어장</b><span class="r">629</span></div>
  <div class="body" id="browse"></div>
  <div class="tabs"><div><i></i>홈</div><div class="on"><i></i>단어장</div><div><i></i>퀴즈</div><div><i></i>진도</div></div>
</div></section>

<section class="frame"><h2>읽기</h2><div class="phone">
  <div class="bar"><span style="font-size:17px">&larr;</span><span class="r">11 / 76</span></div>
  <div class="body" id="read"></div>
  <div class="dock"><div class="s">&larr;</div><div class="m">✓ 학습 완료</div><div class="s">&rarr;</div></div>
</div></section>

<section class="frame"><h2>진도</h2><div class="phone">
  <div class="bar"><b>진도</b><span class="r">629</span></div>
  <div class="body" id="prog"></div>
  <div class="tabs"><div><i></i>홈</div><div><i></i>단어장</div><div><i></i>퀴즈</div><div class="on"><i></i>진도</div></div>
</div></section>

<script>
(function(){
  var M = window.MOCK, c = M.cards[0];
  var esc=function(s){return String(s).replace(/[&<>]/g,function(x){
    return {"&":"&amp;","<":"&lt;",">":"&gt;"}[x];});};
  var plain=function(s){return esc(String(s||"").replace(/\*\*/g,""));};

  document.getElementById("home").innerHTML =
    '<div class="stage">' +
      '<span class="tag">오늘의 단어 · ' + esc(c.bookName) + '</span>' +
      '<h1 class="word">' + esc(c.term) + '</h1>' +
      '<div class="rom">Domain Name System</div>' +
      '<div class="plate">' + c.svg + '</div>' +
    '</div>' +
    '<div class="go">읽기 시작 &rarr;</div>' +
    '<div class="row3">' +
      '<div><div class="n">1</div><div class="k">새 단어</div></div>' +
      '<div><div class="n">4</div><div class="k">복습</div></div>' +
      '<div><div class="n">10</div><div class="k">퀴즈</div></div>' +
    '</div>';

  var ds=["o","r","p","o","o","p","o","o","r","o","p","o","o","o"];
  var cards = M.netlist.slice(0,14).map(function(t,i){
    return '<div class="card"><span class="d ' + ds[i] + '"></span>' +
           '<span class="t">' + esc(t.term) + '</span>' +
           '<span class="s">' + plain(t.summary) + '</span></div>';
  }).join("");
  var bk = M.books.map(function(b,i){
    return '<div' + (i===2?' class="on"':'') + '>' + esc(b.name) + '<em>' + b.n + '</em></div>';
  }).join("");
  document.getElementById("browse").innerHTML =
    '<div class="search">⌕ 단어나 뜻으로 검색</div>' +
    '<div class="books">' + bk + '</div>' +
    '<div class="cards">' + cards + '</div>';

  document.getElementById("read").innerHTML =
    '<div class="stage">' +
      '<span class="tag">' + esc(c.bookName) + '</span>' +
      '<h1 class="word">' + esc(c.term) + '</h1>' +
      '<div class="rom">Domain Name System</div>' +
      '<div class="plate">' + c.svg + '</div>' +
    '</div>' +
    '<div class="lede">DNS는 <u>도메인 이름</u>을 <u>IP 주소</u>로 바꿔주는 시스템이다.</div>';

  var pct=[42,18,63,9,55,27,71,38,84,12,49,33];
  var brows = M.bookSizes.map(function(b,i){
    return '<div class="brow"><span class="n">' + esc(b.name) + '</span>' +
           '<span class="t"><i style="width:' + pct[i] + '%"></i></span>' +
           '<span class="v">' + Math.round(b.n*pct[i]/100) + '/' + b.n + '</span></div>';
  }).join("");
  document.getElementById("prog").innerHTML =
    '<div class="hero-n"><div class="n">212</div>' +
      '<div class="k">629편 중 읽은 것</div>' +
      '<div class="track"><i style="width:33.7%"></i></div></div>' +
    '<div class="mini">' +
      '<div><div class="n">148</div><div class="k">퀴즈 통과</div></div>' +
      '<div><div class="n">17</div><div class="k">복습 필요</div></div>' +
    '</div>' +
    '<div class="blist">' + brows + '</div>';
})();
</script>
</body>
</html>
