# DNS (Domain Name System)

## 📝 정의

DNS는 **도메인 이름을 IP 주소로 바꿔주는 시스템**이다.

사람은 `google.com` 을 기억하고, 컴퓨터는 `142.250.196.78` 로 접속한다. DNS 는 그 사이를 번역한다. 1983년에 만들어졌는데, 그전에는 모든 컴퓨터가 `hosts` 라는 주소록 파일 하나를 각자 들고 있었다.

### 비유
전화번호부. 친구 이름을 대면 번호를 알려주고, 친구가 번호를 바꿔도 이름은 그대로다.

## 🖼️ 그림으로 보기

```도해
흐름: 주소창에 google.com 을 치면 무슨 일이 일어나나
브라우저 :: 캐시에 있나? 있으면 여기서 끝난다
로컬 DNS :: 없으면 ISP 나 `8.8.8.8` 에 묻는다
루트 서버 :: ".com 담당은 저쪽이야"
.com 서버 :: "google.com 담당은 저쪽이야"
권한 서버 :: "142.250.196.78 이야"
< 브라우저 :: 받은 IP 로 접속. TTL 동안 캐시에 둔다
= 다섯 번을 물어 찾아가는 길이지만, 열에 아홉은 첫 줄에서 끝난다
```

## ⚠️ 해결하는 문제

```도해
대조: DNS 가 없으면 인터넷은 어떻게 되나
DNS 없이 || DNS 로
주소 :: 숫자 12자리를 왼다 || 이름만 기억한다
서버 이전 :: 접속 경로가 끊긴다 || 레코드만 고치면 된다
장애 :: 그 서버가 죽으면 끝 || 다른 IP 로 즉시 돌린다
= 사람은 이름을, 기계는 숫자를 쓴다. DNS 는 그 사이의 번역기다
```

숫자 주소를 외우게 하면 인터넷은 대중화되지 않았을 것이다. 서버를 옮길 때마다 사용자에게 새 주소를 공지해야 하고, 북마크는 전부 죽는다.

DNS 는 **이름과 주소를 분리**해서 이 셋을 한꺼번에 해결한다. 이름은 그대로 두고 주소만 갈아끼우면 되기 때문이다.

## ⚙️ 작동 원리

```도해
층: 같은 주소를 두 번째로 열면 왜 빠른가
브라우저 :: 탭을 닫기 전까지. 수십 초
운영체제 :: hosts 파일과 OS 캐시. 수 분
로컬 DNS :: TTL 이 정한 만큼. 보통 5분에서 1시간
권한 서버 :: 원본. 여기까지 오는 요청은 드물다
= 위에서 끝날수록 빠르다. TTL 은 "얼마나 위에 머물까"를 정하는 값이다
```

조회는 **재귀**와 **반복** 두 가지로 나뉜다. 브라우저는 로컬 DNS 에게 "답을 가져와" 라고 한 번만 시키고(재귀), 로컬 DNS 가 루트 → TLD → 권한 서버를 차례로 찾아다닌다(반복). 복잡한 일은 로컬 DNS 가 대신 한다.

## 📊 비교

| 레코드 | 무엇을 가리키나 | 언제 쓰나 |
|---|---|---|
| **A** | IPv4 주소 | 가장 기본 |
| **AAAA** | IPv6 주소 | IPv6 환경 |
| **CNAME** | 다른 도메인 | `www` 를 본체로 넘길 때 |
| **MX** | 메일 서버 | 이메일 수신 |
| **TXT** | 아무 문자열 | 도메인 소유 증명, 메일 인증 |

## 💡 실제 사례

- **무중단 배포** — 새 서버를 띄우고 A 레코드만 바꾸면 사용자는 아무것도 모르는 채 옮겨진다.
- **지역별 응답** — 같은 도메인을 물어도 한국에서는 서울 IP, 미국에서는 버지니아 IP 를 돌려준다. CDN 이 이 방식으로 동작한다.
- **장애 대응** — 헬스체크가 실패하면 그 IP 를 레코드에서 빼버린다.

## 🚫 흔한 오해

- **DNS 가 사이트에 연결해준다** — 아니다. IP 주소를 알려주고 거기서 끝난다. 연결은 그다음에 브라우저가 [[TCP]] 로 직접 맺는다.
- **DNS 를 `8.8.8.8` 로 바꾸면 인터넷이 빨라진다** — 조회 몇십 ms 가 줄어들 뿐이다. 다운로드 속도는 그대로다.
- **도메인을 사면 바로 열린다** — 레코드를 등록하고, 전 세계 캐시가 각자의 TTL 을 소진하기를 기다려야 한다.

## 🚨 주의사항

- **TTL 을 미리 낮춰라.** 이전 당일에 낮추면 이미 퍼진 캐시는 옛 주소를 그대로 물고 있다. 최소 하루 전에 60초로 내려둔다.
- **전파는 즉시가 아니다.** "DNS 전파 중" 은 전 세계 캐시가 각자의 TTL 을 소진하기를 기다린다는 뜻이다.
- **DNS 는 기본적으로 평문이다.** 무엇을 조회했는지 중간에서 다 보인다. DoH / DoT 가 이걸 가린다.

## 📝 정리

DNS 는 이름과 주소를 분리하는 장치다. 이 분리 하나로 기억하기 쉬워지고, 서버를 옮길 수 있고, 장애를 우회할 수 있게 된다. 캐시가 그 값을 싸게 만든다.

## ❓ 이해했는지

- google.com 을 두 번째로 열면 왜 더 빠른가? → 작동 원리
- 서버 IP 를 바꿨는데 어떤 사람은 30분 동안 옛 서버로 간다. 왜인가? → 주의사항
- DNS 가 IP 를 돌려준 다음에는 무슨 일이 일어나나? → 흔한 오해

## 🔗 관련 용어

- [[TCP]] — DNS 조회가 끝난 뒤 실제 연결을 맺는 계층
- [[HTTP]] — 받은 IP 로 주고받는 내용
- [[CDN]] — DNS 응답을 지역별로 다르게 주는 대표적 활용
- [[Load Balancer]] — 하나의 이름 뒤에 여러 서버를 두는 다른 방법

# Circuit Breaker (서킷 브레이커)

## 📝 정의

Circuit Breaker는 **고장 난 서비스 호출을 잠시 끊어버리는 장치**다.

응답이 없는 서비스를 계속 부르면 기다리는 요청이 쌓이고, 결국 부르는 쪽까지 같이 죽는다. 그래서 실패가 일정 횟수를 넘으면 아예 부르지 않고 즉시 실패로 처리한다.

### 비유
집의 두꺼비집. 전선에 문제가 생기면 알아서 내려가서 집 전체가 타는 걸 막는다. 고쳤다고 확신하기 전에 한 번 올려보고, 또 튀면 다시 내린다.

## 🖼️ 그림으로 보기

```도해
흐름: 결제 서비스가 죽으면 주문 서비스는 무엇을 하나
주문 서비스 :: 결제 서비스를 부른다. 응답이 없다
차단기 :: 실패를 센다. 다섯 번째다
차단기 :: 열린다. 이제부터 부르지 않는다
주문 서비스 :: 즉시 "결제 잠시 불가" 로 답한다
차단기 :: 30초 뒤 한 번만 시험 삼아 통과시킨다
@ 다시 닫힘으로 :: 그 한 건이 성공하면. 실패하면 열린 채 30초 더
= 죽은 곳을 계속 두드리지 않는 것이 무너짐을 막는다
```

## ⚠️ 해결하는 문제

```도해
대조: 아래 서비스 하나가 느려지면 어떻게 되나
차단기 없이 || 차단기로
대기 요청 :: 계속 쌓인다 || 즉시 실패 처리
스레드 :: 전부 붙잡힌다 || 풀려 있다
결과 :: 부르는 쪽도 죽음 || 그 기능만 막힘
= 한 곳의 고장이 옆으로 번지지 않게 벽을 세우는 것이다
```

서비스 하나가 죽는 것보다 무서운 건 그 죽음이 번지는 것이다. 결제 서비스가 응답하지 않으면 주문 서비스의 스레드가 하나씩 거기 붙잡히고, 몇 분 안에 주문 서비스도 새 요청을 못 받는다. 주문이 멈추면 그 위의 화면 서비스도 멈춘다.

차단기는 그 사슬을 끊는다. 결제가 안 되는 것과 사이트 전체가 안 되는 것은 전혀 다른 사고다.

## ⚙️ 작동 원리

상태가 셋이고, 그 사이를 돈다.

```도해
흐름: 차단기는 어떤 상태를 오가나
닫힘 :: 평소. 그냥 통과시키고 실패만 센다
열림 :: 실패가 한도를 넘음. 부르지 않고 즉시 실패
반열림 :: 일정 시간 뒤. 한 건만 시험 삼아 통과
@ 닫힘 또는 열림으로 :: 그 한 건의 성패가 정한다
= 반열림이 있어서, 회복됐는지 확인하려고 폭주시키지 않아도 된다
```

열림 상태에서 무엇을 돌려줄지 정해두는 것이 중요하다. 캐시에 있던 옛 값을 주거나, 기본값을 주거나, 사용자에게 솔직하게 알리거나. 이 대비책을 [[Fallback]]이라고 한다.

## 💡 실제 사례

- **추천 목록** — 추천 서비스가 죽으면 인기 상품 목록으로 대체한다. 화면은 계속 뜬다.
- **외부 API** — 환율 API가 응답하지 않으면 마지막으로 받은 환율을 그대로 쓰고 표시만 바꾼다.
- **부분 장애 표시** — 결제만 막히면 "결제 점검 중"으로 안내하고 장바구니는 계속 쓰게 둔다.

## 🚫 흔한 오해

- **차단기가 장애를 고쳐준다** — 고치지 않는다. 번지는 것을 막을 뿐이고, 고장 난 서비스는 여전히 고장 나 있다.
- **재시도를 하면 차단기는 필요 없다** — 반대다. 재시도만 하면 죽어가는 서비스에 부하를 더 얹어 더 빨리 죽인다. 재시도와 차단기는 같이 써야 한다.
- **열림 상태는 오류다** — 설계대로 동작하는 정상 상태다. 오류로 취급해 알람을 끄면 정작 볼 신호를 잃는다.

## 🚨 주의사항

- **폴백을 정해두지 않으면 절반만 쓴 것이다.** 열렸을 때 무엇을 돌려줄지가 사용자 경험을 정한다.
- **한도를 너무 낮게 잡지 않는다.** 일시적인 지연에도 열려버리면 멀쩡한 기능이 자주 막힌다.

## 📝 정리

Circuit Breaker는 실패가 반복되는 호출을 잠시 끊어 장애가 번지는 것을 막는 장치다. 닫힘, 열림, 반열림 세 상태를 오가며, 열렸을 때 무엇을 돌려줄지 정해두어야 제 값을 한다.

## ❓ 이해했는지

- 결제 서비스 하나가 느려졌는데 사이트 전체가 멈추는 이유는? → 해결하는 문제
- 재시도만 넣으면 왜 상황이 더 나빠지나? → 흔한 오해
- 반열림 상태가 없으면 회복 확인을 어떻게 해야 하고, 그게 왜 위험한가? → 작동 원리

## 🔗 관련 용어

- [[Rate Limiting]] — 들어오는 쪽을 막는다. 차단기는 나가는 쪽을 막는다
- [[Latency]] — 응답이 늦어지는 정도. 차단기가 실패로 셀지 정하는 기준
- [[Monolith vs Microservices]] — 서비스를 나누면서 이 장치가 필요해졌다
- [[Fallback]] — 차단기가 열렸을 때 대신 돌려줄 것

# JWT (JSON Web Token)

## 📝 정의

JWT는 **내용과 서명을 함께 담아 위조를 막은 토큰**이다.

서버가 사용자 정보를 적고 자기만 아는 열쇠로 서명해서 준다. 다음 요청에 그 토큰이 오면, 서버는 저장소를 뒤지지 않고 서명만 확인해서 진짜인지 안다.

### 비유
공연 티켓의 홀로그램. 티켓에 좌석 정보가 적혀 있고 위조 방지 무늬가 찍혀 있다. 직원은 명단을 찾아볼 필요 없이 무늬만 보고 통과시킨다.

## 🖼️ 그림으로 보기

```도해
흐름: 로그인한 뒤 요청마다 무슨 확인이 일어나나
사용자 :: 아이디와 비밀번호로 로그인한다
서버 :: 사용자 정보를 적고 서명해서 토큰을 준다
브라우저 :: 토큰을 저장해둔다
브라우저 :: 다음 요청 헤더에 토큰을 붙인다
서버 :: 서명이 맞는지만 계산한다. DB 조회 없음
< 사용자 :: 통과. 서버는 아무것도 기억하지 않았다
= 서버가 기억하는 대신 토큰이 스스로를 증명한다
```

## ⚠️ 해결하는 문제

```도해
대조: 서버를 여러 대로 늘리면 무엇이 달라지나
세션 방식 |=| JWT 방식
로그인 확인 :: 저장소를 뒤진다 || 서명만 계산
서버 추가 :: 저장소 공유 필요 || 열쇠만 있으면 됨
즉시 로그아웃 :: 지우면 끝 || 만료까지 유효
= 저장소를 없애는 대신 강제 로그아웃을 잃는 거래다
```

전통적인 [[Session]] 방식은 서버가 로그인 상태를 기억한다. 서버가 한 대일 때는 문제가 없지만 여러 대로 늘리면 그 기억을 공유해야 한다. 요청이 어느 서버로 갈지 모르기 때문이다.

JWT는 기억을 토큰 쪽으로 옮긴다. 서버는 서명 열쇠만 갖고 있으면 되고, 저장소를 공유할 필요가 없다. 대신 발급한 토큰을 중간에 취소할 수 없다는 문제가 생긴다.

## ⚙️ 작동 원리

토큰은 점으로 구분된 세 부분이다.

```도해
층: 토큰 세 조각은 각각 무엇인가
헤더 :: 어떤 방식으로 서명했는지
페이로드 :: 사용자 ID, 권한, 만료 시각
서명 :: 앞의 둘을 열쇠로 계산한 값
= 앞의 둘은 누구나 읽을 수 있다. 서명만 못 만든다
```

여기가 가장 많이 오해받는 지점이다. 페이로드는 암호화된 게 아니라 그냥 인코딩된 것이라 누구나 열어볼 수 있다. 서명이 막는 것은 **읽기가 아니라 고치기**다.

## 💡 실제 사례

- **API 인증** — 로그인 후 받은 토큰을 헤더에 붙여 보낸다.
- **서비스 간 신뢰** — 게이트웨이가 검증한 사용자 정보를 토큰에 담아 뒤쪽 서비스로 넘긴다.
- **짧은 만료 + 갱신 토큰** — 접근 토큰은 몇 분짜리로 짧게 두고, 갱신 토큰으로 새로 받는다.

## 🚫 흔한 오해

- **JWT의 내용은 암호화되어 있다** — 인코딩일 뿐이라 누구나 열어 읽는다. 비밀번호나 주민번호를 페이로드에 넣으면 그대로 노출된다.
- **로그아웃하면 토큰이 무효가 된다** — 서버가 기억하지 않으므로 만료 전까지 계속 유효하다. 즉시 차단하려면 별도의 차단 목록이 필요하다.
- **JWT가 세션보다 항상 낫다** — 서버가 한두 대면 [[Session]]이 더 단순하고 강제 로그아웃도 된다.

## 🚨 주의사항

- **`alg: none` 을 거부한다.** 서명 방식을 토큰이 스스로 정하게 두면 공격자가 서명을 없앤 토큰을 보낼 수 있다. 서버가 허용할 방식을 못 박는다.
- **만료를 짧게 잡는다.** 취소할 수 없으니 유효 기간이 곧 피해 시간이다.

## 📝 정리

JWT는 내용과 서명을 함께 담아 서버가 기억하지 않아도 되게 만든 토큰이다. 서버를 늘리기 쉬워지는 대신 발급한 토큰을 취소할 수 없다.

## ❓ 이해했는지

- 토큰에 비밀번호를 담으면 왜 위험한가? → 작동 원리
- 로그아웃 버튼을 눌러도 토큰이 살아 있는 이유는? → 흔한 오해
- 서버가 한 대뿐인 서비스에서 세션 대신 JWT를 쓸 이유가 있나? → 해결하는 문제
