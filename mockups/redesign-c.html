<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>개편안 C — 여백</title>
<style>
/* ============================================================
   개편안 C — 여백
   레퍼런스: Minimal Landing Page / Agency Website UI

   그 장르가 쓰는 수단은 셋이다. 아주 큰 표제, 아주 넓은 여백, 거의
   없는 색. 버튼도 상자가 아니라 밑줄 그은 글자다.

   그대로 옮기면 목록이 성겨져서 629편을 훑기 나빠진다. 그래서 한 가지를
   비틀었다 — **큰 글자는 표제어에만 쓰고, 뜻은 아예 안 싣는다.** 이름만
   두 칸으로 세우면 큰 글자를 쓰면서도 화면당 서른둘이 들어간다.
   여백은 위아래로 벌리고, 목록은 좌우로 조인다.
   ============================================================ */

@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-display:swap;
  src:url("../fonts/pretendard-subset.woff2") format("woff2-variations")}

:root{
  --paper:#faf9f7;
  --surface:#ffffff;
  --sunken:#f0efec;
  --line:#e5e3de;
  --line-2:#111111;      /* 강조선은 회색이 아니라 잉크다. 이 장르의 버릇 */

  --ink:#111111;
  --ink-2:#5a5852;
  --ink-3:#8e8b84;
  --ink-inverse:#faf9f7;

  --st-new:#8e8b84;      --st-new-bg:#eceae6;
  --st-reading:#2c5f7c;  --st-reading-bg:#e6eef3;
  --st-learned:#3a6b4c;
  --st-passed:#235c43;
  --st-review:#8a5a18;

  --font-sans:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;

  /* 그림 629편이 요구하는 이름들. 이 아홉 개(surface, surface-sunken,
     line-strong, ink, ink-2, ink-3, st-reading, st-reading-bg, font-mono)가
     없으면 컷이 까맣게 떨어진다. 개편에서 이름을 바꾸면 안 되는 계약이다. */
  --surface-sunken:var(--sunken);
  --line-strong:#cfccc6;
  --r:0px;              /* 모서리를 전부 없앤다 */
}
:root[data-theme="dark"]{
  --surface-sunken:var(--sunken); --line-strong:#3a3a37;
  --paper:#0d0d0c; --surface:#161615; --sunken:#1d1d1b;
  --line:#262624; --line-2:#f2f1ee;
  --ink:#f2f1ee; --ink-2:#a5a29b; --ink-3:#7b7871; --ink-inverse:#0d0d0c;
  --st-new:#7b7871; --st-new-bg:#1f1f1d;
  --st-reading:#8cbdd6; --st-reading-bg:#16242b;
  --st-learned:#86c2a0; --st-passed:#9ad3b2; --st-review:#e0ac5e;
}

*{box-sizing:border-box}
body{margin:0;background:#4a4a48;font-family:var(--font-sans);
     display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start}
.frame{width:390px;flex:0 0 390px}
.frame>h2{color:#fff;font-size:12px;font-weight:700;margin:0 0 6px 2px}
.phone{width:390px;height:844px;overflow:hidden;background:var(--paper);
       color:var(--ink);display:flex;flex-direction:column}

/* 상단바를 지운다. 이 장르는 머리를 얹지 않는다. 필요한 표시는
   본문 맨 위 작은 글자로 흘린다. */
.body{flex:1;overflow:hidden;padding:0 26px}
.top{display:flex;align-items:baseline;padding:30px 0 0;
     font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;
     text-transform:uppercase;color:var(--ink-3)}
.top .r{margin-left:auto}

.tabs{flex:0 0 58px;display:flex;align-items:center;gap:22px;padding:0 26px;
      border-top:1px solid var(--line)}
.tabs div{font-size:12.5px;color:var(--ink-3)}
.tabs div.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -1.5px 0 var(--ink)}

/* ---- 표제 ----
   이 장르의 중심. 화면 폭을 거의 다 쓴다. */
.word{font-size:60px;font-weight:800;letter-spacing:-.045em;line-height:.94;
      margin:26px 0 0;text-wrap:balance}
.word.sm{font-size:46px}
.rom{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;
     color:var(--ink-3);margin-top:14px;text-transform:uppercase}

.plate{margin:30px 0 0}
.plate svg{width:100%;height:auto;display:block}

/* ---- 밑줄 링크형 액션 ----
   상자 버튼 대신 밑줄. 대신 눌리는 자리는 44px 를 지킨다. */
.act{display:inline-flex;align-items:center;gap:10px;height:44px;
     margin-top:26px;font-size:17px;font-weight:700;letter-spacing:-.01em;
     border-bottom:1.5px solid var(--line-2);color:var(--ink)}
.act .ar{font-size:15px}

/* ---- 숫자 줄 ----
   상자 없이 큰 숫자와 아주 작은 라벨. */
.stats{display:flex;gap:0;margin-top:34px;border-top:1px solid var(--line);padding-top:20px}
.stats div{flex:1}
.stats .n{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1;
          font-variant-numeric:tabular-nums}
.stats .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.09em;
          text-transform:uppercase;color:var(--ink-3);margin-top:9px}

.rule{height:1px;background:var(--line);margin:26px 0}

/* ---- 검색 ---- */
.search{display:flex;align-items:center;height:44px;margin-top:22px;
        border-bottom:1.5px solid var(--line-2);color:var(--ink-3);font-size:15px}

/* ---- 권 줄 ---- */
.books{display:flex;gap:18px;margin-top:20px;overflow:hidden;font-size:12px}
.books div{white-space:nowrap;color:var(--ink-3)}
.books div.on{color:var(--ink);font-weight:700}
.books em{font-style:normal;font-family:var(--font-mono);font-size:10px;margin-left:4px}

/* ---- 두 칸 큰 글자 목록 ----
   큰 글자를 쓰면서 밀도를 지키는 유일한 방법은 뜻을 빼는 것이다.
   뜻이 궁금하면 누른다. */
.list{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;margin-top:18px}
.li{display:flex;align-items:center;gap:7px;padding:9px 0;min-width:0}
.li .t{font-size:15px;font-weight:600;letter-spacing:-.015em;
       overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.li .d{flex:0 0 5px;height:5px;border-radius:50%;background:var(--st-new)}
.li .d.o{background:transparent;box-shadow:inset 0 0 0 1.2px var(--st-new)}
.li .d.r{background:var(--st-reading)}
.li .d.p{background:var(--st-passed)}
.li.done .t{color:var(--ink-3)}

/* ---- 읽기 ---- */
.lede{font-size:20px;line-height:1.6;letter-spacing:-.015em;margin-top:30px;
      max-width:22rem}
.lede u{text-decoration:none;box-shadow:inset 0 -6px 0 var(--st-reading-bg)}
.dock{flex:0 0 74px;display:flex;align-items:center;padding:0 26px;
      border-top:1px solid var(--line);gap:20px}
.dock .l{font-size:15px;color:var(--ink-3)}
.dock .m{margin-left:auto;display:inline-flex;align-items:center;gap:9px;height:44px;
         font-size:16px;font-weight:700;border-bottom:1.5px solid var(--line-2)}

/* ---- 진도 ----
   막대도 격자도 아니고, 큰 숫자 하나와 아주 얇은 선들. */
.big{font-size:82px;font-weight:800;letter-spacing:-.05em;line-height:.9;
     margin-top:18px;font-variant-numeric:tabular-nums}
.big small{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--ink-3);
           margin-left:8px}
.bars{margin-top:30px}
.bar{display:flex;align-items:center;gap:12px;padding:9px 0;
     border-bottom:1px solid var(--line)}
.bar .n{flex:0 0 76px;font-size:12px;overflow:hidden;white-space:nowrap;
        text-overflow:ellipsis;color:var(--ink-2)}
/* 채워진 회색 트랙을 쓰지 않는다. 얇은 선 하나에 잉크로 칠한 만큼만 얹는다. */
.bar .t{flex:1;height:1.5px;background:var(--line);position:relative}
.bar .t i{position:absolute;left:0;top:0;height:1.5px;background:var(--ink)}
.bar .v{flex:0 0 32px;text-align:right;font-family:var(--font-mono);
        font-size:10.5px;color:var(--ink-3)}
</style>
</head>
<body>
<script src="_mockdata.js"></script>

<section class="frame"><h2>홈</h2><div class="phone">
  <div class="body" id="home"></div>
  <div class="tabs"><div class="on">홈</div><div>단어장</div><div>퀴즈</div><div>진도</div></div>
</div></section>

<section class="frame"><h2>단어장 — 큰 글자로도 서른둘</h2><div class="phone">
  <div class="body" id="browse"></div>
  <div class="tabs"><div>홈</div><div class="on">단어장</div><div>퀴즈</div><div>진도</div></div>
</div></section>

<section class="frame"><h2>읽기</h2><div class="phone">
  <div class="body" id="read"></div>
  <div class="dock"><div class="l">&larr;</div><div class="m">학습 완료 <span>&rarr;</span></div></div>
</div></section>

<section class="frame"><h2>진도</h2><div class="phone">
  <div class="body" id="prog"></div>
  <div class="tabs"><div>홈</div><div>단어장</div><div>퀴즈</div><div class="on">진도</div></div>
</div></section>

<script>
(function(){
  var M = window.MOCK, c = M.cards[0];
  var esc = function(s){return String(s).replace(/[&<>]/g,function(x){
    return {"&":"&amp;","<":"&lt;",">":"&gt;"}[x];});};

  document.getElementById("home").innerHTML =
    '<div class="top"><span>8월 24일 월요일</span><span class="r">' + esc(c.bookName) + '</span></div>' +
    '<h1 class="word">' + esc(c.term) + '</h1>' +
    '<div class="rom">Domain Name System</div>' +
    '<div class="plate">' + c.svg + '</div>' +
    '<div class="act">읽기 시작 <span class="ar">&rarr;</span></div>' +
    '<div class="stats">' +
      '<div><div class="n">1</div><div class="k">새 단어</div></div>' +
      '<div><div class="n">4</div><div class="k">복습</div></div>' +
      '<div><div class="n">10</div><div class="k">퀴즈</div></div>' +
    '</div>';

  var ds = ["o","r","p","o","o","p","o","o","r","o","p","o","o","o","p","o",
            "o","r","o","p","o","o","o","p","o","o","r","o","o","p","o","o"];
  var lis = M.netlist.slice(0,32).map(function(t,i){
    return '<div class="li' + (ds[i]==="p"?" done":"") + '"><span class="d ' + ds[i] + '"></span>' +
           '<span class="t">' + esc(t.term) + '</span></div>';
  }).join("");
  var bk = M.books.map(function(b,i){
    return '<div' + (i===2?' class="on"':'') + '>' + esc(b.name) + '<em>' + b.n + '</em></div>';
  }).join("");
  document.getElementById("browse").innerHTML =
    '<div class="top"><span>단어장</span><span class="r">629</span></div>' +
    '<div class="search">단어나 뜻으로 검색</div>' +
    '<div class="books">' + bk + '</div>' +
    '<div class="list">' + lis + '</div>';

  document.getElementById("read").innerHTML =
    '<div class="top"><span>' + esc(c.bookName) + '</span><span class="r">11 / 76</span></div>' +
    '<h1 class="word sm">' + esc(c.term) + '</h1>' +
    '<div class="rom">Domain Name System</div>' +
    '<div class="plate">' + c.svg + '</div>' +
    '<div class="lede">DNS는 <u>도메인 이름</u>을 <u>IP 주소</u>로 바꿔주는 시스템이다.</div>';

  var pct = [42,18,63,9,55,27,71,38,84,12,49,33];
  var bars = M.bookSizes.map(function(b,i){
    return '<div class="bar"><span class="n">' + esc(b.name) + '</span>' +
           '<span class="t"><i style="width:' + pct[i] + '%"></i></span>' +
           '<span class="v">' + Math.round(b.n*pct[i]/100) + '</span></div>';
  }).join("");
  document.getElementById("prog").innerHTML =
    '<div class="top"><span>진도</span><span class="r">629 중</span></div>' +
    '<div class="big">212<small>편을 읽었다</small></div>' +
    '<div class="bars">' + bars + '</div>';
})();
</script>
</body>
</html>
