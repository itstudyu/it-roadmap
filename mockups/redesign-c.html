<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>개편안 C — 체계</title>
<style>
/* ============================================================
   개편안 C — 체계
   레퍼런스: Nexcent

   그 화면이 쓰는 수단.
     1) 아주 옅은 회청색 바탕, 흰 카드
     2) 초록 액센트. 제목 안의 강조 문구까지 초록으로 물들인다
     3) 그림(일러스트)이 오른쪽에 크게 앉고 왼쪽에 글이 선다
     4) 아이콘 + 큰 숫자 + 작은 라벨로 된 지표 줄
     5) 절마다 가운데 정렬 제목 + 카드 격자

   셋 중 가장 "앱처럼 생긴" 안이라 이 제품에 가장 덜 낯설다. 대신 가장
   흔한 얼굴이기도 하다. 그게 이 안의 값이자 값어치다.

   ── 부딪히는 곳과 그 해결 ──
   초록이 학습 상태의 초록과 정면으로 겹친다. 레퍼런스의 초록을 살리려면
   상태 쪽이 비켜야 한다. 여기서는 **상태를 잉크 농도로 말한다.**
   옅은 회색 → 중간 → 진한 잉크. 초록은 브랜드가 독점한다.
   ============================================================ */

@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-display:swap;
  src:url("../fonts/pretendard-subset.woff2") format("woff2-variations")}

:root{
  --paper:#f5f7f8;
  --surface:#ffffff;
  --surface-sunken:#eceff1;
  --line:#e2e7ea;
  --line-strong:#c5ced3;

  --ink:#263238;
  --ink-2:#546067;
  --ink-3:#8a959b;
  --ink-inverse:#ffffff;

  /* 레퍼런스의 초록. 이 안에서 색을 쓰는 유일한 자리다. */
  --green:#3aa14b;
  --green-soft:#e6f4e8;
  --green-deep:#2d7d3a;

  /* 상태는 색이 아니라 잉크 농도. 위 주석 참고. */
  --s1:#d3dade;   /* 아직 */
  --s2:#8a959b;   /* 읽는 중 */
  --s3:#546067;   /* 학습 완료 */
  --s4:#263238;   /* 퀴즈 통과 */

  --st-reading:#2c5f7c; --st-reading-bg:#e7eff3;

  --font-sans:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --r:12px; --r-lg:16px;
}

*{box-sizing:border-box}
body{margin:0;background:#6b757a;font-family:var(--font-sans);
     display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start}
.frame{width:390px;flex:0 0 390px}
.frame>h2{color:#fff;font-size:12px;font-weight:700;margin:0 0 6px 2px}
.phone{width:390px;height:844px;overflow:hidden;background:var(--paper);
       color:var(--ink);display:flex;flex-direction:column}

.bar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 18px;
     background:var(--surface);border-bottom:1px solid var(--line)}
.bar .mk{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;
         letter-spacing:-.02em}
.bar .mk i{width:20px;height:20px;border-radius:6px;background:var(--green);display:block}
.bar .r{margin-left:auto;height:32px;padding:0 14px;border-radius:999px;background:var(--green);
        color:#fff;display:flex;align-items:center;font-size:12.5px;font-weight:700}
.body{flex:1;overflow:hidden;padding:0 18px}
.tabs{flex:0 0 62px;display:grid;grid-template-columns:repeat(4,1fr);
      background:var(--surface);border-top:1px solid var(--line)}
.tabs div{display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:4px;font-size:10.5px;color:var(--ink-3)}
.tabs div.on{color:var(--green);font-weight:700}
.tabs i{width:18px;height:18px;border:1.7px solid currentColor;border-radius:6px;display:block}
.tabs div.on i{background:currentColor}

/* ---- 히어로 ----
   레퍼런스의 "Lessons and insights / from 8 years" — 둘째 줄만 초록. */
.hero{background:var(--surface);border-radius:var(--r-lg);padding:20px 18px;margin-top:14px;
      border:1px solid var(--line)}
.hero h1{font-size:27px;font-weight:800;letter-spacing:-.028em;line-height:1.24;margin:0}
.hero h1 em{font-style:normal;color:var(--green);display:block}
.hero p{font-size:13px;color:var(--ink-3);margin:10px 0 0;line-height:1.65}
.hero .art{margin-top:16px}
.hero .art svg{width:100%;height:auto;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 22px;
     border-radius:8px;background:var(--green);color:#fff;font-weight:700;font-size:14.5px;
     margin-top:16px}

/* ---- 지표 줄 ----
   레퍼런스의 2,245,341 / 46,328 꼴. 아이콘 + 숫자 + 라벨. */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
     padding:13px 14px;display:flex;align-items:center;gap:11px}
.kpi .ic{flex:0 0 32px;height:32px;border-radius:9px;background:var(--green-soft);
         display:flex;align-items:center;justify-content:center}
.kpi .ic b{width:12px;height:12px;border-radius:3px;background:var(--green);display:block}
.kpi > span:last-child{min-width:0}
.kpi .n{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1;
        font-variant-numeric:tabular-nums}
.kpi .k{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;
        overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---- 절 제목 ----
   레퍼런스는 가운데 정렬을 쓴다. */
.sech{text-align:center;margin-top:22px}
.sech h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0}
.sech p{font-size:12px;color:var(--ink-3);margin:5px 0 0}

/* ---- 검색 ---- */
.search{display:flex;align-items:center;gap:9px;height:44px;margin-top:14px;padding:0 14px;
        background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
        color:var(--ink-3);font-size:14px}

/* ---- 권 알약 ---- */
.chips{display:flex;gap:8px;margin-top:12px;overflow:hidden}
.chips div{flex:0 0 auto;height:32px;padding:0 13px;border-radius:999px;background:var(--surface);
           border:1px solid var(--line);display:flex;align-items:center;gap:6px;
           font-size:12.5px;white-space:nowrap;color:var(--ink-2)}
.chips div.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
.chips em{font-style:normal;font-family:var(--font-mono);font-size:10px;opacity:.75}

/* ---- 목록 카드 ----
   레퍼런스의 카드 문법을 쓰되 한 줄로 눌러 밀도를 지킨다. */
.cards{margin-top:12px;display:grid;gap:7px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      padding:11px 13px;display:flex;align-items:center;gap:10px;min-width:0}
.card .t{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.card .s{font-size:11.5px;color:var(--ink-3);overflow:hidden;white-space:nowrap;
         text-overflow:ellipsis;flex:1}
/* 상태 = 잉크 농도. 초록은 브랜드가 가져갔다. */
.d{flex:0 0 8px;height:8px;border-radius:50%;background:var(--s1)}
.d.s2{background:var(--s2)} .d.s3{background:var(--s3)} .d.s4{background:var(--s4)}

/* ---- 읽기 ---- */
.rd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:18px;margin-top:14px}
.rd .bk{font-size:11.5px;color:var(--green);font-weight:700}
.rd h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:7px 0 0}
.rd .rom{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);margin-top:6px}
.rd .art{margin-top:16px}
.rd .art svg{width:100%;height:auto;display:block}
.lede{font-size:15.5px;line-height:1.68;margin-top:14px;background:var(--surface);
      border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.lede u{text-decoration:none;border-bottom:2px solid var(--green-soft);font-weight:700}
.dock{flex:0 0 78px;display:flex;align-items:center;gap:10px;padding:0 18px;
      background:var(--surface);border-top:1px solid var(--line)}
.dock .s{flex:0 0 44px;height:44px;border-radius:999px;border:1px solid var(--line-strong);
         display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.dock .m{flex:1;height:46px;border-radius:8px;background:var(--green);color:#fff;
         display:flex;align-items:center;justify-content:center;gap:8px;
         font-weight:700;font-size:15px}

/* ---- 진도 ---- */
.rows{margin-top:12px;background:var(--surface);border:1px solid var(--line);
      border-radius:var(--r);padding:4px 14px}
.pr{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr .n{flex:0 0 72px;font-size:12.5px;color:var(--ink-2);overflow:hidden;
       white-space:nowrap;text-overflow:ellipsis}
.pr .t{flex:1;height:6px;border-radius:999px;background:var(--surface-sunken);overflow:hidden}
.pr .t i{display:block;height:6px;background:var(--green);border-radius:999px}
.pr .v{flex:0 0 42px;text-align:right;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}
</style>
</head>
<body>
<script src="_mockdata.js"></script>

<section class="frame"><h2>홈</h2><div class="phone">
  <div class="bar"><span class="mk"><i></i>단어</span><span class="r">복습 146</span></div>
  <div class="body" id="home"></div>
  <div class="tabs"><div class="on"><i></i>홈</div><div><i></i>단어장</div><div><i></i>퀴즈</div><div><i></i>진도</div></div>
</div></section>

<section class="frame"><h2>단어장</h2><div class="phone">
  <div class="bar"><span class="mk"><i></i>단어장</span><span class="r">629</span></div>
  <div class="body" id="browse"></div>
  <div class="tabs"><div><i></i>홈</div><div class="on"><i></i>단어장</div><div><i></i>퀴즈</div><div><i></i>진도</div></div>
</div></section>

<section class="frame"><h2>읽기</h2><div class="phone">
  <div class="bar"><span style="font-size:17px">&larr;</span><span class="r">11 / 76</span></div>
  <div class="body" id="read"></div>
  <div class="dock"><div class="s">&larr;</div><div class="m">✓ 학습 완료</div><div class="s">&rarr;</div></div>
</div></section>

<section class="frame"><h2>진도</h2><div class="phone">
  <div class="bar"><span class="mk"><i></i>진도</span><span class="r">249 / 629</span></div>
  <div class="body" id="prog"></div>
  <div class="tabs"><div><i></i>홈</div><div><i></i>단어장</div><div><i></i>퀴즈</div><div class="on"><i></i>진도</div></div>
</div></section>

<script>
(function(){
  var M=window.MOCK, c=M.cards[0];
  var esc=function(s){return String(s).replace(/[&<>]/g,function(x){
    return {"&":"&amp;","<":"&lt;",">":"&gt;"}[x];});};
  var plain=function(s){return esc(String(s||"").replace(/\*\*/g,""));};

  document.getElementById("home").innerHTML =
    '<div class="hero">' +
      '<h1>오늘 익힐 단어는<em>' + esc(c.term) + '</em></h1>' +
      '<p>' + esc(c.bookName) + ' · 그림 세 컷으로 먼저 보고 읽습니다.</p>' +
      '<div class="art">' + c.svg + '</div>' +
      '<div class="btn">읽기 시작 &rarr;</div>' +
    '</div>' +
    '<div class="kpis">' +
      '<div class="kpi"><span class="ic"><b></b></span><span><span class="n">249</span>' +
        '<span class="k">읽은 단어</span></span></div>' +
      '<div class="kpi"><span class="ic"><b></b></span><span><span class="n">146</span>' +
        '<span class="k">복습 대기</span></span></div>' +
      '<div class="kpi"><span class="ic"><b></b></span><span><span class="n">6</span>' +
        '<span class="k">연속 학습</span></span></div>' +
      '<div class="kpi"><span class="ic"><b></b></span><span><span class="n">12</span>' +
        '<span class="k">단어장</span></span></div>' +
    '</div>';

  var ds=["","s2","s4","","s3","s4","","","s2","","s4","","","s3"];
  document.getElementById("browse").innerHTML =
    '<div class="search">⌕ 단어나 뜻으로 검색</div>' +
    '<div class="chips">' + M.books.map(function(b,i){
      return '<div' + (i===2?' class="on"':'') + '>' + esc(b.name) + ' <em>' + b.n + '</em></div>';
    }).join("") + '</div>' +
    '<div class="cards">' + M.netlist.slice(0,14).map(function(t,i){
      return '<div class="card"><span class="d ' + ds[i] + '"></span>' +
             '<span class="t">' + esc(t.term) + '</span>' +
             '<span class="s">' + plain(t.summary) + '</span></div>'; }).join("") + '</div>';

  document.getElementById("read").innerHTML =
    '<div class="rd"><div class="bk">' + esc(c.bookName) + '</div>' +
      '<h1>' + esc(c.term) + '</h1>' +
      '<div class="rom">Domain Name System</div>' +
      '<div class="art">' + c.svg + '</div></div>' +
    '<div class="lede">DNS는 <u>도메인 이름</u>을 <u>IP 주소</u>로 바꿔주는 시스템이다.</div>';

  var pct=[62,48,33,41,25,19,11,14,9,52,21,38];
  document.getElementById("prog").innerHTML =
    '<div class="kpis" style="margin-top:14px">' +
      '<div class="kpi"><span class="ic"><b></b></span><span><span class="n">249</span>' +
        '<span class="k">읽은 단어</span></span></div>' +
      '<div class="kpi"><span class="ic"><b></b></span><span><span class="n">146</span>' +
        '<span class="k">복습 대기</span></span></div>' +
    '</div>' +
    '<div class="sech"><h2>단어장별 진행률</h2><p>12권 629편</p></div>' +
    '<div class="rows">' + M.books.map(function(b,i){
      return '<div class="pr"><span class="n">' + esc(b.name) + '</span>' +
             '<span class="t"><i style="width:' + pct[i] + '%"></i></span>' +
             '<span class="v">' + Math.round(b.n*pct[i]/100) + '/' + b.n + '</span></div>';
    }).join("") + '</div>';
})();
</script>
</body>
</html>
