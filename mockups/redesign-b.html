<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>개편안 B — 판본</title>
<style>
/* ============================================================
   개편안 B — 판본 (Plate)

   A 와 같은 진단에서 출발하되 네 가지를 다르게 답한다.

   1) 어두운 바탕을 기본으로 둔다. 밤에 읽는 시간이 길고, 그림의 흰 선이
      어두운 바탕에서 가장 또렷하다.
   2) 표제어에 세리프를 크게 쓴다. 사전이라는 장르의 관습이고, 영문
      표제어와 한글 설명을 글자꼴로 갈라 준다.
   3) **브랜드색을 하나 들인다.** 지금은 색이 학습 상태만 말하는데,
      그래서 "지금 눌러야 할 것" 을 색으로 가리킬 수단이 없다. 대신
      상태는 색이 아니라 **모양**(빈 원·반원·채운 원·삼각)으로 말하게
      옮긴다. 이게 A 와 B 를 가르는 진짜 결정이다.
   4) 목록은 뜻이 아니라 이름을 훑게 만든다. 두 칸으로 세우면 한 화면에
      서른여섯이 들어간다. 뜻이 궁금하면 누르면 된다.
   ============================================================ */

@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-display:swap;
  src:url("../fonts/pretendard-subset.woff2") format("woff2-variations")}
@font-face{font-family:"Source Serif 4";font-weight:200 900;font-display:swap;
  src:url("../fonts/source-serif-4-latin.woff2") format("woff2-variations")}

:root{
  --paper:#100f13;
  --surface:#191820;
  --surface-sunken:#211f2a;
  --line:#2b2934;
  --line-strong:#454150;

  --ink:#f0eef4;
  --ink-2:#a8a3b4;
  --ink-3:#7c7789;
  --ink-inverse:#100f13;

  /* 자두. 초록·호박·강청은 학습 상태와 오답 표시가 이미 가져갔고,
     빨강은 오답과 부딪힌다. 남은 자리 중 이 앱과 어울리는 색이다. */
  --accent:#d187b6;
  --accent-ink:#17131b;
  --accent-dim:#3a2434;

  /* 상태는 색을 거의 쓰지 않는다. 모양이 뜻을 진다. */
  --st-mark:#8f8a9c;
  --st-done:#f0eef4;

  --danger:#e08b81;

  --font-sans:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --font-head:"Source Serif 4",Charter,Georgia,serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;

  /* 모서리 규칙: 전부 날카롭게. 판본이니까. 누르는 것만 알약. */
  --r-flat:0px; --r-full:999px;

  /* 그림이 쓰는 토큰. **브랜드색으로 덮지 않는다.** 그림에서 파랑은
     "옮겨지는 그것" 이라는 뜻을 지고 있어서, 자두색으로 칠하면 브랜드와
     뜻이 한 색에 겹친다. 처음 칠해 보고 알았다. */
  --st-reading:#8cbdd6;
  --st-reading-bg:#17262e;
}

*{box-sizing:border-box}
body{margin:0;background:#3a3742;font-family:var(--font-sans);
     display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start}
.frame{width:390px;flex:0 0 390px}
.frame > h2{color:#fff;font-size:12px;font-weight:700;margin:0 0 6px 2px}
.phone{width:390px;height:844px;overflow:hidden;border-radius:14px;
       background:var(--paper);color:var(--ink);display:flex;flex-direction:column}

.bar{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:10px;
     padding:0 20px;border-bottom:1px solid var(--line)}
.bar b{font-family:var(--font-head);font-size:19px;font-weight:600;letter-spacing:-.01em}
.bar .sp{margin-left:auto}
.bar .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.body{flex:1;overflow:hidden;padding:0 20px}
.tabs{flex:0 0 64px;display:grid;grid-template-columns:repeat(4,1fr);
      border-top:1px solid var(--line)}
.tabs div{display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:4px;font-size:10.5px;color:var(--ink-3)}
.tabs div.on{color:var(--accent)}
.tabs i{width:18px;height:18px;display:block;border:1.6px solid currentColor}
.tabs div.on i{background:currentColor}

/* ---- 판 머리 ----
   권 이름과 그 권에서의 번호. 어디쯤 왔는지가 늘 보인다. */
.ph{display:flex;align-items:center;gap:10px;padding:20px 0 0}
.ph .book{font-size:11.5px;letter-spacing:.06em;color:var(--ink-3)}
.ph .no{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.word{font-family:var(--font-head);font-size:46px;font-weight:600;
      letter-spacing:-.02em;line-height:1.0;margin:8px 0 0}
.rom{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);margin-top:8px}

/* ---- 판 ----
   그림을 얇은 테두리로 감싸 판처럼 세운다. A 는 액자를 지웠고
   B 는 액자를 남긴다. 인쇄된 도판이라는 인상이 여기서 나온다. */
.plate{margin-top:18px;border:1px solid var(--line);background:var(--surface)}
.plate svg{width:100%;height:auto;display:block}
.plate .cap{border-top:1px solid var(--line);padding:8px 12px;
            font-size:11px;color:var(--ink-3);line-height:1.5}

.lede{font-family:var(--font-head);font-size:19px;line-height:1.55;margin:18px 0 0}
.lede u{text-decoration:none;border-bottom:1.5px solid var(--accent);color:var(--ink)}

/* ---- 오늘 ----
   테두리 없는 숫자 셋. 상자를 씌우지 않는다. */
.today{display:flex;gap:26px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.today .n{font-family:var(--font-head);font-size:27px;font-weight:600;
          font-variant-numeric:tabular-nums;line-height:1}
.today .k{font-size:11px;color:var(--ink-3);margin-top:5px}
.today div.hot .n{color:var(--accent)}

.cta{margin-top:20px}
.btn{height:52px;border-radius:var(--r-full);background:var(--accent);
     color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
     gap:8px;font-weight:700;font-size:15px}
.btn.quiet{background:transparent;border:1px solid var(--line-strong);color:var(--ink);margin-top:9px}

.streak{display:flex;align-items:center;gap:6px;margin-top:20px}
.streak .lab{font-size:11.5px;color:var(--ink-3);margin-right:auto;white-space:nowrap;flex:0 0 auto}
.streak span{width:6px;height:22px;background:var(--line-strong)}
.streak span.on{background:var(--accent)}

/* ---- 검색 ---- */
.search{display:flex;align-items:center;gap:9px;height:44px;margin-top:16px;
        padding:0 14px;border:1px solid var(--line-strong);
        color:var(--ink-3);font-size:14px;border-radius:var(--r-full)}

/* ---- 권 줄 ---- */
.books{display:flex;gap:20px;margin:16px -20px 0;padding:0 20px;overflow:hidden;
       border-bottom:1px solid var(--line)}
.book{flex:0 0 auto;padding-bottom:10px;font-size:13.5px;white-space:nowrap;color:var(--ink-3)}
.book.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
.book em{font-style:normal;font-family:var(--font-mono);font-size:10.5px;margin-left:5px}

/* ---- 두 칸 목록 ----
   이름만 훑는다. 뜻은 눌러서 본다. 서른여섯이 한 화면에 들어간다. */
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;margin-top:4px}
.cell{display:flex;align-items:center;gap:8px;padding:10px 0;
      border-bottom:1px solid var(--line);min-width:0}
.cell .t{font-size:13.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell.done .t{color:var(--ink-3)}
/* 상태를 색이 아니라 모양으로 말한다 */
.m{flex:0 0 10px;height:10px;border:1.5px solid var(--st-mark);border-radius:var(--r-full)}
.m.half{background:linear-gradient(90deg,var(--st-mark) 50%,transparent 50%)}
.m.full{background:var(--st-mark);border-color:var(--st-mark)}
.m.done{background:var(--st-done);border-color:var(--st-done)}
.m.rev{border-radius:0;transform:rotate(45deg);border-color:var(--accent)}

/* ---- 진도 띠 ----
   629칸을 끊지 않고 한 줄기로 흘린다. 권이 바뀌는 자리만 살짝 벌린다.
   전체가 한 덩어리라는 감각이 여기서 나온다. */
.nums{display:flex;gap:28px;padding:22px 0 6px}
.nums .n{font-family:var(--font-head);font-size:34px;font-weight:600;
         line-height:1;font-variant-numeric:tabular-nums}
.nums .k{font-size:11px;color:var(--ink-3);margin-top:6px}
.nums div.hot .n{color:var(--accent)}
.ribbon{margin-top:18px}
.rrow{display:flex;align-items:center;gap:9px;padding:6px 0}
.rrow .bn{flex:0 0 78px;font-size:11.5px;color:var(--ink-2);
          overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rrow .track{flex:1;display:flex;gap:1.5px}
.rrow .track i{flex:1;height:13px;background:var(--surface-sunken);display:block}
.rrow .track i.r{background:var(--accent-dim)}
.rrow .track i.d{background:var(--ink-3)}
.rrow .track i.p{background:var(--accent)}
.rrow .bc{flex:0 0 30px;text-align:right;font-family:var(--font-mono);
          font-size:10.5px;color:var(--ink-3)}
.rlab{display:flex;gap:14px;margin-top:18px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.rlab b{display:inline-flex;align-items:center;gap:6px;font-weight:400}
.rlab i{width:8px;height:12px;display:block}

.dock{flex:0 0 80px;display:flex;align-items:center;gap:10px;padding:0 20px;
      border-top:1px solid var(--line)}
.dock .side{flex:0 0 46px;height:46px;border-radius:var(--r-full);
            border:1px solid var(--line-strong);display:flex;align-items:center;
            justify-content:center;color:var(--ink-2)}
.dock .main{flex:1;height:50px;border-radius:var(--r-full);background:var(--accent);
            color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
            gap:8px;font-weight:700;font-size:15px}
</style>
</head>
<body>
<script src="_mockdata.js"></script>

<section class="frame">
  <h2>홈 — 오늘의 판</h2>
  <div class="phone">
    <div class="bar"><b>8월 24일</b><span class="sp"></span><span class="meta">1일 연속</span></div>
    <div class="body" id="home-body"></div>
    <div class="tabs"><div class="on"><i></i>홈</div><div><i></i>단어장</div><div><i></i>퀴즈</div><div><i></i>진도</div></div>
  </div>
</section>

<section class="frame">
  <h2>단어장 — 한 화면에 서른여섯</h2>
  <div class="phone">
    <div class="bar"><b>단어장</b><span class="sp"></span><span class="meta">629</span></div>
    <div class="body" id="browse-body"></div>
    <div class="tabs"><div><i></i>홈</div><div class="on"><i></i>단어장</div><div><i></i>퀴즈</div><div><i></i>진도</div></div>
  </div>
</section>

<section class="frame">
  <h2>읽기 — 도판과 세리프</h2>
  <div class="phone">
    <div class="bar"><span style="font-size:17px">&larr;</span><span class="sp"></span><span class="meta">11 / 76</span></div>
    <div class="body" id="read-body"></div>
    <div class="dock"><div class="side">&larr;</div><div class="main">✓ 학습 완료</div><div class="side">&rarr;</div></div>
  </div>
</section>

<section class="frame">
  <h2>진도 — 끊기지 않는 띠</h2>
  <div class="phone">
    <div class="bar"><b>진도</b><span class="sp"></span><span class="meta">629</span></div>
    <div class="body" id="prog-body"></div>
    <div class="tabs"><div><i></i>홈</div><div><i></i>단어장</div><div><i></i>퀴즈</div><div class="on"><i></i>진도</div></div>
  </div>
</section>

<script>
(function () {
  var M = window.MOCK;
  var card = M.cards[0];
  var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); };

  document.getElementById("home-body").innerHTML =
    '<div class="ph"><span class="book">' + esc(card.bookName) + '</span>' +
      '<span class="no">오늘의 단어</span></div>' +
    '<h1 class="word">' + esc(card.term) + '</h1>' +
    '<div class="rom">Domain Name System</div>' +
    '<div class="plate">' + card.svg +
      '<div class="cap">' + esc(card.alt) + '</div></div>' +
    '<div class="today">' +
      '<div><div class="n">1</div><div class="k">새 단어</div></div>' +
      '<div class="hot"><div class="n">4</div><div class="k">복습</div></div>' +
      '<div><div class="n">10</div><div class="k">퀴즈</div></div>' +
    '</div>' +
    '<div class="cta"><div class="btn">읽기 시작 &rarr;</div></div>';

  /* ---- 두 칸 목록 ---- */
  var marks = ["", "full", "done", "", "half", "", "rev", "done", "", "", "full", "",
               "", "done", "", "half", "", "", "rev", "", "done", "", "", "full",
               "", "", "half", "", "done", "", "", "", "full", "", "", "rev"];
  var cells = M.netlist.slice(0, 36).map(function (t, i) {
    var m = marks[i] || "";
    return '<div class="cell' + (m === "done" ? " done" : "") + '">' +
           '<span class="m ' + m + '"></span>' +
           '<span class="t">' + esc(t.term) + '</span></div>';
  }).join("");
  var books = M.books.map(function (b, i) {
    return '<div class="book' + (i === 2 ? " on" : "") + '">' + esc(b.name) +
           '<em>' + b.n + '</em></div>';
  }).join("");
  document.getElementById("browse-body").innerHTML =
    '<div class="search">⌕ 단어나 뜻으로 검색</div>' +
    '<div class="books">' + books + '</div>' +
    '<div class="grid2">' + cells + '</div>';

  document.getElementById("read-body").innerHTML =
    '<div class="ph"><span class="book">' + esc(card.bookName) + '</span></div>' +
    '<h1 class="word">' + esc(card.term) + '</h1>' +
    '<div class="rom">Domain Name System</div>' +
    '<div class="plate">' + card.svg + '</div>' +
    '<div class="lede">DNS는 <u>도메인 이름</u>을 <u>IP 주소</u>로 바꿔주는 시스템이다.</div>';

  /* ---- 진도 띠 ---- */
  var cls = ["", "", "", "r", "", "d", "", "", "p", "", "", "",
             "r", "", "", "p", "", "", "", "d", "", "", "r", ""];
  var ribbon = M.bookSizes.map(function (b, bi) {
    var cells = "";
    /* 권마다 칸 수가 28에서 84까지 다르다. 폭을 맞추려고 칸을 늘리면
       "많이 했다" 가 아니라 "칸이 크다" 로 읽힌다. 그래서 40칸으로
       고르게 잘라 비율만 보여 주고, 실제 개수는 오른쪽에 숫자로 적는다. */
    for (var i = 0; i < 40; i++) {
      cells += '<i class="' + (bi < 7 ? cls[(i * 5 + bi * 4) % cls.length] : "") + '"></i>';
    }
    return '<div class="rrow"><span class="bn">' + esc(b.name) + '</span>' +
           '<span class="track">' + cells + '</span>' +
           '<span class="bc">' + b.n + '</span></div>';
  }).join("");
  document.getElementById("prog-body").innerHTML =
    '<div class="nums">' +
      '<div class="hot"><div class="n">148</div><div class="k">퀴즈 통과</div></div>' +
      '<div><div class="n">212</div><div class="k">공부한 단어</div></div>' +
      '<div><div class="n">17</div><div class="k">복습</div></div>' +
    '</div>' +
    '<div class="ribbon">' + ribbon + '</div>' +
    '<div class="rlab">' +
      '<b><i style="background:var(--surface-sunken)"></i>아직</b>' +
      '<b><i style="background:var(--accent-dim)"></i>읽는 중</b>' +
      '<b><i style="background:var(--ink-3)"></i>학습 완료</b>' +
      '<b><i style="background:var(--accent)"></i>퀴즈 통과</b></div>';
})();
</script>
</body>
</html>
