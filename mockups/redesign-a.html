<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>개편안 A — 표본</title>
<style>
/* ============================================================
   개편안 A — 표본 (Specimen)

   생각: 이 앱이 남과 다른 것은 컷 만화 하나뿐인데, 지금은 그걸 접힌 선
   아래에 숨겨 두고 화면 예산을 빈 카드와 0% 진행바에 쓰고 있다.
   그림을 인터페이스로 올린다.

   색은 늘리지 않는다. 지금 규칙(브랜드색 없음, 가장 진한 잉크가 곧
   액션색, 색은 학습 상태만 말한다)은 옳다. 상태가 초록·호박·파랑을
   이미 쓰고 있어서 브랜드색을 넣으면 화면의 색이 넷이 되고 무슨 색이
   무슨 뜻인지 흐려진다. 바꾸는 것은 구성·밀도·글자·그림의 지위다.
   ============================================================ */

@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-display:swap;
  src:url("../fonts/pretendard-subset.woff2") format("woff2-variations")}

:root{
  /* 바탕을 따뜻한 종이에서 차가운 종이로 옮긴다. 그림의 선이 파랑을
     쓰기 때문에 바탕이 미세하게 파랑 쪽으로 기울면 그림이 종이에
     얹힌 게 아니라 종이에 인쇄된 것처럼 보인다. */
  --paper:#f6f7f9;
  --surface:#ffffff;
  --surface-sunken:#eceef2;
  --line:#e0e3e9;
  --line-strong:#c8cdd6;

  --ink:#14161a;      /* 본문·표제어·주요 버튼 바탕 */
  --ink-2:#474d58;
  --ink-3:#727986;
  --ink-inverse:#f6f7f9;

  /* 학습 상태. 뜻을 가진 유일한 색이다. */
  --st-new:#727986;      --st-new-bg:#eceef2;
  --st-reading:#2c5f7c;  --st-reading-bg:#e4eef4;
  --st-learned:#3a6b4c;  --st-learned-bg:#e6f0e9;
  --st-passed:#235c43;   --st-passed-bg:#dcebe2;
  --st-review:#8a5a18;   --st-review-bg:#f6eddc;

  --font-sans:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;

  --r-chip:6px; --r-control:10px; --r-container:14px; --r-full:999px;
}
:root[data-theme="dark"]{
  --paper:#0f1114; --surface:#171a1f; --surface-sunken:#1e2228;
  --line:#272c33; --line-strong:#3c434c;
  --ink:#eef0f3; --ink-2:#a7aeb9; --ink-3:#7d848f; --ink-inverse:#0f1114;
  --st-new:#7d848f; --st-new-bg:#20242a;
  --st-reading:#8cbdd6; --st-reading-bg:#17262e;
  --st-learned:#86c2a0; --st-learned-bg:#16261d;
  --st-passed:#9ad3b2; --st-passed-bg:#13241a;
  --st-review:#e0ac5e; --st-review-bg:#271f13;
}

*{box-sizing:border-box}
body{margin:0;background:#5a5f66;font-family:var(--font-sans);
     display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start}
.frame{width:390px;flex:0 0 390px}
.frame > h2{color:#fff;font-size:12px;font-weight:700;margin:0 0 6px 2px;letter-spacing:.02em}
.phone{width:390px;height:844px;overflow:hidden;border-radius:14px;
       background:var(--paper);color:var(--ink);position:relative;
       display:flex;flex-direction:column}

/* ---- 공통 뼈대 ---- */
.bar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:10px;
     padding:0 18px;border-bottom:1px solid var(--line)}
.bar b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.bar .sp{margin-left:auto}
.bar .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.body{flex:1;overflow:hidden;padding:0 18px}
.tabs{flex:0 0 62px;display:grid;grid-template-columns:repeat(4,1fr);
      border-top:1px solid var(--line);background:var(--surface)}
.tabs div{display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:3px;font-size:10.5px;color:var(--ink-3)}
.tabs div.on{color:var(--ink);font-weight:700}
.tabs i{width:19px;height:19px;display:block;border:1.6px solid currentColor;border-radius:4px}
.tabs div.on i{background:currentColor;border-color:currentColor}

/* ---- 표본 머리 ----
   자리표시 라벨 대신 실제 정보를 넣는다. 권 이름과 번호는 그 단어가
   629편 중 어디쯤인지를 말해 주므로 장식이 아니다. */
.plate-head{display:flex;align-items:baseline;gap:8px;padding:16px 0 2px}
.plate-head .book{font-size:12px;color:var(--ink-3)}
.plate-head .no{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.word{font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:2px 0 0}
.rom{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-3);margin-top:5px}

/* ---- 그림판 ----
   카드 테두리를 없애고 그림 자체를 판으로 쓴다. 액자를 지우면
   같은 높이에서 그림이 커진다. */
.plate{margin:14px -18px 0;padding:0 18px}
.plate svg{width:100%;height:auto;display:block}

.lede{font-size:15px;line-height:1.65;color:var(--ink-2);margin:14px 0 0}
.lede b{color:var(--ink);font-weight:700}

/* ---- 오늘 할 일 ----
   숫자 셋을 한 줄에 붙인다. 지금은 이 정보가 화면에 아예 없다. */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:16px;
       background:var(--line);border:1px solid var(--line);border-radius:var(--r-container);overflow:hidden}
.today div{background:var(--surface);padding:11px 12px}
.today .n{font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.today .k{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.today .n.rev{color:var(--st-review)}
.today .n.qz{color:var(--st-passed)}

.cta{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;height:50px;border-radius:var(--r-control);border:0;
     background:var(--ink);color:var(--ink-inverse);
     font:700 15px/1 var(--font-sans);display:flex;align-items:center;justify-content:center;gap:7px}
.btn.ghost{flex:0 0 50px;background:transparent;border:1px solid var(--line-strong);color:var(--ink)}

/* ---- 연속일 ----
   카드를 없애고 한 줄로 눕힌다. 카드는 계층을 말할 때만 쓴다. */
.streak{display:flex;align-items:center;gap:7px;margin-top:16px;
        padding-top:14px;border-top:1px solid var(--line)}
.streak .lab{font-size:12px;color:var(--ink-3);margin-right:auto;
              white-space:nowrap;flex:0 0 auto}
.streak span{width:15px;height:15px;border-radius:var(--r-full);
             border:1.5px solid var(--line-strong)}
.streak span.on{background:var(--ink);border-color:var(--ink)}

/* ---- 검색 ---- */
.search{display:flex;align-items:center;gap:9px;height:42px;margin:14px 0 0;
        padding:0 13px;background:var(--surface-sunken);border-radius:var(--r-control);
        color:var(--ink-3);font-size:14px}

/* ---- 권 고르개 ----
   12권을 세로 카드로 쌓으면 화면 셋을 쓴다. 옆으로 눕히면 한 줄이다. */
.books{display:flex;gap:8px;margin:12px -18px 0;padding:0 18px;overflow:hidden}
.book{flex:0 0 auto;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-full);
      background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;
      display:flex;align-items:center;gap:7px}
.book.on{background:var(--ink);color:var(--ink-inverse);border-color:var(--ink)}
.book em{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.book.on em{color:var(--ink-inverse);opacity:.7}

/* ---- 단어 줄 ----
   지금은 두 줄에 24px 여백이라 한 화면에 여덟이다. 한 줄로 줄이고
   뜻을 회색으로 이어 붙이면 열넷이 들어간다. 629편을 훑는 앱에서
   화면당 항목 수는 취향이 아니라 기능이다. */
.rows{margin-top:12px}
.row{display:flex;align-items:baseline;gap:9px;padding:9.5px 0;
     border-bottom:1px solid var(--line)}
.row .dot{flex:0 0 7px;height:7px;border-radius:var(--r-full);
          border:1.5px solid var(--st-new);align-self:center}
.row .dot.reading{background:var(--st-reading);border-color:var(--st-reading)}
.row .dot.passed{background:var(--st-passed);border-color:var(--st-passed)}
.row .dot.learned{border-color:var(--st-learned);border-width:2.5px}
.row .t{font-size:14.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--ink-3);overflow:hidden;white-space:nowrap;
        text-overflow:ellipsis;flex:1}

/* ---- 진도 격자 ----
   629칸을 한 화면에 깐다. 권별 진행바 열두 개보다 이 그림 하나가
   "내가 어디까지 왔나" 를 더 정확히 말한다. */
.grid-head{display:flex;align-items:baseline;gap:6px;margin-top:14px}
.grid-head .bn{font-size:12px;font-weight:700}
.grid-head .bc{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);margin-left:auto}
.grid{display:flex;flex-wrap:wrap;gap:2.5px;margin-top:6px}
.grid i{width:9px;height:9px;border-radius:2px;background:var(--st-new-bg);display:block}
.grid i.reading{background:var(--st-reading)}
.grid i.learned{background:var(--st-learned)}
.grid i.passed{background:var(--st-passed)}
.grid i.review{background:var(--st-review)}

.nums{display:flex;gap:18px;padding:16px 0 4px}
.nums div .n{font-size:26px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.nums div .k{font-size:11.5px;color:var(--ink-3);margin-top:1px}

.legend{display:flex;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
        font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.legend b{display:inline-flex;align-items:center;gap:5px;font-weight:400}
.legend i{width:9px;height:9px;border-radius:2px;display:block}

/* ---- 읽기 화면 ----
   여기만 밀도를 낮춘다. 읽는 자리다. */
.read .body{padding-top:4px}
.read-lede{background:var(--surface);border:1px solid var(--line);
           border-radius:var(--r-container);padding:15px 16px;margin-top:14px;
           font-size:16px;line-height:1.7}
.read-lede u{text-decoration:none;border-bottom:2px dotted var(--st-reading);
             font-weight:700;color:var(--ink)}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 10px;
      border-radius:var(--r-full);font-size:11.5px;font-weight:700;
      background:var(--st-reading-bg);color:var(--st-reading);margin-top:10px}
.dock{flex:0 0 76px;display:flex;align-items:center;gap:9px;padding:0 18px;
      border-top:1px solid var(--line);background:var(--surface)}
.dock .side{flex:0 0 44px;height:44px;border-radius:var(--r-full);
            border:1px solid var(--line-strong);display:flex;align-items:center;
            justify-content:center;color:var(--ink-2);font-size:15px}
.dock .main{flex:1;height:48px;border-radius:var(--r-control);background:var(--ink);
            color:var(--ink-inverse);display:flex;align-items:center;justify-content:center;
            gap:7px;font-weight:700;font-size:15px}
</style>
</head>
<body>
<script src="_mockdata.js"></script>

<!-- ================= 홈 ================= -->
<section class="frame">
  <h2>홈 — 오늘의 표본</h2>
  <div class="phone">
    <div class="bar"><b>8월 24일 월요일</b><span class="sp"></span><span class="meta">읽은 지 1일</span></div>
    <div class="body" id="home-body"></div>
    <div class="tabs">
      <div class="on"><i></i>홈</div><div><i></i>단어장</div><div><i></i>퀴즈</div><div><i></i>진도</div>
    </div>
  </div>
</section>

<!-- ================= 단어장 ================= -->
<section class="frame">
  <h2>단어장 — 한 화면에 열넷</h2>
  <div class="phone">
    <div class="bar"><b>단어장</b><span class="sp"></span><span class="meta">629</span></div>
    <div class="body" id="browse-body"></div>
    <div class="tabs">
      <div><i></i>홈</div><div class="on"><i></i>단어장</div><div><i></i>퀴즈</div><div><i></i>진도</div>
    </div>
  </div>
</section>

<!-- ================= 읽기 ================= -->
<section class="frame">
  <h2>읽기 — 그림이 접힌 선 위로</h2>
  <div class="phone read">
    <div class="bar"><span style="font-size:17px">&larr;</span><span class="sp"></span><span class="meta">11 / 76</span></div>
    <div class="body" id="read-body"></div>
    <div class="dock">
      <div class="side">&larr;</div>
      <div class="main">✓ 학습 완료</div>
      <div class="side">&rarr;</div>
    </div>
  </div>
</section>

<!-- ================= 진도 ================= -->
<section class="frame">
  <h2>진도 — 629칸 한 장</h2>
  <div class="phone">
    <div class="bar"><b>진도</b><span class="sp"></span><span class="meta">629</span></div>
    <div class="body" id="prog-body"></div>
    <div class="tabs">
      <div><i></i>홈</div><div><i></i>단어장</div><div><i></i>퀴즈</div><div class="on"><i></i>진도</div>
    </div>
  </div>
</section>

<script>
(function () {
  var M = window.MOCK;
  var card = M.cards[0];                       // net--dns
  var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); };
  /* 요약문에는 **강조** 표시가 들어 있다. 앱은 UI.plain 으로 벗겨서 그린다. */
  var plain = function (s) { return esc(String(s || "").replace(/\*\*/g, "")); };

  /* ---- 홈 ---- */
  document.getElementById("home-body").innerHTML =
    '<div class="plate-head"><span class="book">' + esc(card.bookName) + '</span>' +
      '<span class="no">오늘의 단어</span></div>' +
    '<h1 class="word">' + esc(card.term) + '</h1>' +
    '<div class="rom">Domain Name System</div>' +
    '<div class="plate">' + card.svg + '</div>' +
    '<div class="today">' +
      '<div><div class="n">1</div><div class="k">새 단어</div></div>' +
      '<div><div class="n rev">4</div><div class="k">복습</div></div>' +
      '<div><div class="n qz">10</div><div class="k">퀴즈</div></div>' +
    '</div>' +
    '<div class="cta"><div class="btn">읽기 시작 &rarr;</div><div class="btn ghost">↷</div></div>' +
    '<div class="streak"><span class="lab">이번 주</span>' +
      '<span class="on"></span><span></span><span></span><span></span>' +
      '<span></span><span></span><span></span></div>';

  /* ---- 단어장 ---- */
  var st = ["", "reading", "passed", "", "learned", "", "", "passed", "", "", "reading", "", "", "learned"];
  var rows = M.netlist.slice(0, 14).map(function (t, i) {
    return '<div class="row"><span class="dot ' + (st[i] || "") + '"></span>' +
           '<span class="t">' + esc(t.term) + '</span>' +
           '<span class="s">' + plain(t.summary) + '</span></div>';
  }).join("");
  var books = M.books.map(function (b, i) {
    return '<div class="book' + (i === 2 ? " on" : "") + '">' + esc(b.name) +
           ' <em>' + b.n + '</em></div>';
  }).join("");
  document.getElementById("browse-body").innerHTML =
    '<div class="search">⌕ 단어나 뜻으로 검색</div>' +
    '<div class="books">' + books + '</div>' +
    '<div class="rows">' + rows + '</div>';

  /* ---- 읽기 ---- */
  document.getElementById("read-body").innerHTML =
    '<div class="plate-head"><span class="book">' + esc(card.bookName) + '</span></div>' +
    '<h1 class="word">' + esc(card.term) + '</h1>' +
    '<div class="rom">Domain Name System</div>' +
    '<div class="plate">' + card.svg + '</div>' +
    '<div class="read-lede">DNS는 <u>도메인 이름</u>을 <u>IP 주소</u>로 바꿔주는 시스템이다.</div>' +
    '<div class="hint">점선 밑줄 단어를 탭하면 바로 아래에 풀이가 열린다</div>' +
    '<div class="chip">읽는 중</div>';

  /* ---- 진도 ---- */
  var states = ["", "", "", "reading", "", "learned", "", "", "passed", "", "", "",
                "review", "", "", "passed", "", "", "", "learned", "", "", "reading", ""];
  var html =
    '<div class="nums">' +
      '<div><div class="n">148</div><div class="k">퀴즈 통과</div></div>' +
      '<div><div class="n">212</div><div class="k">공부한 단어</div></div>' +
      '<div><div class="n">17</div><div class="k">복습 필요</div></div>' +
    '</div>';
  M.bookSizes.forEach(function (b, bi) {
    var cells = "";
    for (var i = 0; i < b.n; i++) {
      var s = (bi < 6) ? states[(i * 7 + bi * 3) % states.length] : (i % 11 === 0 ? "reading" : "");
      cells += '<i class="' + s + '"></i>';
    }
    html += '<div class="grid-head"><span class="bn">' + esc(b.name) + '</span>' +
            '<span class="bc">' + b.n + '</span></div>' +
            '<div class="grid">' + cells + '</div>';
  });
  html += '<div class="legend">' +
    '<b><i style="background:var(--st-new-bg)"></i>아직</b>' +
    '<b><i style="background:var(--st-reading)"></i>읽는 중</b>' +
    '<b><i style="background:var(--st-learned)"></i>학습 완료</b>' +
    '<b><i style="background:var(--st-passed)"></i>퀴즈 통과</b>' +
    '<b><i style="background:var(--st-review)"></i>복습</b></div>';
  document.getElementById("prog-body").innerHTML = html;
})();
</script>
</body>
</html>
